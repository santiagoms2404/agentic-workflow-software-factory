# AWSF — the only committed tuning surface.
# Shaped exactly per specs/awsf-architecture-proposal.md §7.3.5, adapted
# from its illustrative flat src/ layout to this repo's actual two-workspace
# File Manifest (core/src/**, dashboard/**).
# Durable intent: no machine paths, no credentials, no PIDs, no measured quota state. 
# A durable per-route quota POLICY THRESHOLD is permitted (W07/G7-A, 2026-08-24): it is 
# a number the owner chooses once, not a reading that changes minute to minute, 
# so invariant 1 does not reach it.
# Validated by core/src/config/{schema,load}.ts against the awsf/v1 schema.

schema: awsf/v1

project:
  slug: agentic-workflow-software-factory
  default_workflow: plan-build-test

runtime:
  silence_timeout_seconds: 2700
  process_grace_seconds: 2
  max_output_bytes: 67108864
  max_event_count: 100000
  # Local provisioning only: copied from canonical after worktree creation.
  # Every entry is repository-relative, Git-ignored, and snapshot-safe.
  seed_paths: [node_modules]

adapters:
  claude:      { kind: claude-code, executable: claude }
  codex:       { kind: pi-codex, executable: pi, provider: openai-codex }
  antigravity: { kind: antigravity, executable: agy, enabled: false }
  stub:        { kind: fixture }
  fusion:      { kind: composite-fusion, enabled: false }

routing:
  default_worker: claude
  review: invert-provider
  no_fallback: true

agents:
  - name: planner
    model: claude:opus
    thinking: high
    color: "#A78BFA"
    purpose: Produce an implementable plan with explicit acceptance criteria.
    prompt: { system: prompts/planner/system.md, user: prompts/planner/user.md }
    harness: { adapter: claude, continuity: none }
    tools: { profile: readonly, allow: [read, grep, find, ls] }
    writes: []

  - name: builder
    model: codex:gpt-5.6-sol
    thinking: xhigh
    color: "#22D3EE"
    purpose: Implement the validated plan in the assigned worktree.
    prompt: { system: prompts/builder/system.md, user: prompts/builder/user.md }
    harness: { adapter: codex, continuity: none }
    tools: { profile: managed-worker, allow: [read, grep, find, ls, edit, write, exec] }
    writes: ["core/src/**", "core/test/**", "dashboard/**", "prompts/**"]

  - name: reviewer
    model: claude:opus # inverted automatically when the builder runs on claude
    thinking: high
    color: "#F43F5E"
    purpose: Find concrete defects the deterministic gates do not cover.
    prompt: { system: prompts/reviewer/system.md, user: prompts/reviewer/user.md }
    harness: { adapter: claude, continuity: none }
    # Judge the code on disk, not the builder's summary of it. `readonly` is
    # read/grep/find/ls and nothing else — it carries no exec, so the reviewer
    # still cannot run `git diff` and the host-composed diff is retained
    # alongside this rather than replaced by it.
    tools: { profile: readonly, allow: [read, grep, find, ls] }
    writes: [] # a reviewer that cannot fix cannot quietly fix

  - name: documenter
    model: claude:sonnet
    thinking: low
    color: "#C084FC"
    purpose: Update docs to match a landed change; never touch source.
    prompt: { system: prompts/documenter/system.md, user: prompts/documenter/user.md }
    harness: { adapter: claude, continuity: none }
    tools: { profile: managed-worker, allow: [read, grep, find, ls, edit, write] }
    writes: ["README.md"]

  - name: scout
    model: claude:sonnet
    thinking: low
    color: "#FBBF24"
    purpose: Read the repo and report what exists, without proposing changes.
    prompt: { system: prompts/scout/system.md, user: prompts/scout/user.md }
    harness: { adapter: claude, continuity: none }
    tools: { profile: readonly, allow: [read, grep, find, ls] }
    writes: []

  - name: intake
    model: claude:sonnet
    thinking: low
    color: "#F59E0B"
    purpose: Refine vague work into a validated ticket with observable acceptance criteria.
    prompt: { system: prompts/intake/system.md, user: prompts/intake/user.md }
    harness: { adapter: claude, continuity: same-session }
    tools: { profile: managed-worker, allow: [read, grep, find, ls, edit, write] }
    writes: ["specs/tickets/**"]

  - name: designer
    model: claude:opus
    thinking: xhigh
    color: "#5EEAD4"
    purpose: State the architecture, its invariants, and its acceptance criteria as identified claims.
    prompt: { system: prompts/designer/system.md, user: prompts/designer/user.md }
    harness: { adapter: claude, continuity: none }
    tools: { profile: readonly, allow: [read, grep, find, ls] }
    writes: []

  - name: architecture-reviewer
    # Cross-provider independence is configured here. Keep this role on the
    # provider opposite designer and change both together if either moves.
    model: codex:gpt-5.6-sol
    thinking: high
    color: "#FB7185"
    purpose: Judge a design against its own stated invariants and name what it did not check.
    prompt: { system: prompts/architecture-reviewer/system.md, user: prompts/architecture-reviewer/user.md }
    harness: { adapter: codex, continuity: none }
    tools: { profile: readonly, allow: [read, grep, find, ls] }
    writes: []

workflows:
    enabled: [scout, plan, build, plan-build-test, build-review, simple-sdlc, intake, design-to-plan]

gates:
  test: { argv: [npm, run, test:unit], timeout_seconds: 600 }
  typecheck: { argv: [npm, run, typecheck], timeout_seconds: 300 }
  lint: { argv: [npm, run, lint], timeout_seconds: 300 }

risk:
  default: T1
  call_ceiling: { T0: 1, T1: 3, T2: 5 }
  correction_allowance: { auto: 1, owner: 1 }
  paths:
    "core/src/execution/**": T2
    "core/src/policy/**": T2
    "core/src/state/**": T2
    "core/src/persistence/**": T2
    "core/src/observability/**": T2
    "dashboard/**": T1

policy:
  protected_paths:
    - awsf.config.yaml
    - awsf.project.yaml
    - AGENTS.md
    - core/src/state/**
    - core/src/policy/**
    - core/src/observability/migrations/**
    - core/src/execution/transport-broker.ts
  protected_operations: [credential-access, external-mutation, delete, migration, release-cutover, credit-billed-model]

observability:
  poll_ms: 500
  db: state://awsf.db
  persist_thinking_text: false

pricing:
  display_mode: estimated-api-equivalent
  effective_date: null
  models: {} # empty by default ⇒ subscription routes render "— subscription"
