# AWSF — the only committed tuning surface.
# Durable intent: no machine paths, no credentials, no PIDs, no quota fields.
# Validated by core/src/config/{schema,load}.ts against the awsf/v1 schema.

schema: awsf/v1

project:
  name: Agentic Workflow Software Factory
  slug: awsf

runtime:
  default_workflow: build-review
  default_tier: 1
  poll_ms: 2000

adapters:
  - id: claude-code
    kind: claude-code
    enabled: true
  - id: pi-codex
    kind: pi-codex
    enabled: true
  - id: antigravity
    kind: antigravity
    enabled: false # Q1: ships as a probe returning `blocked` with E_ADAPTER_UNVERIFIED
  - id: stub
    kind: stub
    enabled: true
  - id: fusion
    kind: fusion
    enabled: false # Q5: composite adapter deferred to v1.1; contract reserved now

routing:
  review: invert-provider
  no_fallback: true

agents:
  - name: scout
    model: claude-sonnet-5
    thinking: low
    color: "#FBBF24"
    purpose: Reads the repo and reports what exists, without proposing changes.
    prompt: prompts/scout.md
    harness: claude-code
    tools: []
    writes: []
  - name: planner
    model: claude-sonnet-5
    thinking: medium
    color: "#A78BFA"
    purpose: Turns a request into goals, steps, acceptance criteria, and risks.
    prompt: prompts/planner.md
    harness: claude-code
    tools: []
    writes: []
  - name: builder
    model: claude-sonnet-5
    thinking: medium
    color: "#22D3EE"
    purpose: Implements the plan's steps and reports the exact commands it ran.
    prompt: prompts/builder.md
    harness: claude-code
    tools: [Read, Write, Edit, Bash]
    writes: ["**"]
  - name: reviewer
    model: pi-codex-terra
    thinking: medium
    color: "#F43F5E"
    purpose: Reviews the committed candidate diff from the opposite provider.
    prompt: prompts/reviewer.md
    harness: pi-codex
    tools: [Read]
    writes: [] # a reviewer that cannot fix cannot quietly fix
  - name: documenter
    model: claude-sonnet-5
    thinking: low
    color: "#C084FC"
    purpose: Updates docs to match a landed change; never touches source.
    prompt: prompts/documenter.md
    harness: claude-code
    tools: [Read, Write, Edit]
    writes: ["**/*.md"]

workflows:
  - id: scout
    enabled: true
  - id: plan
    enabled: true
  - id: build
    enabled: true
  - id: plan-build-test
    enabled: true
  - id: build-review
    enabled: true
  - id: simple-sdlc
    enabled: true

gates:
  envelope:
    kind: envelope_valid
  artifacts:
    kind: artifacts_exist
  files_non_empty:
    kind: files_non_empty
  json_parses:
    kind: json_parses
  diff_matches_claims:
    kind: diff_matches_claims
  head_advanced:
    kind: head_advanced
  no_protected_paths:
    kind: no_protected_paths
  writes_within_globs:
    kind: writes_within_globs
  verdict_consistent:
    kind: verdict_consistent
  unit_tests:
    kind: commands_pass
    argv: ["npm", "run", "test:unit"]
  typecheck:
    kind: commands_pass
    argv: ["npm", "run", "typecheck"]
  lint:
    kind: commands_pass
    argv: ["npm", "run", "lint"]
  journey:
    kind: journey_passes

risk:
  tier_ceilings:
    "0": 1
    "1": 3
    "2": 5
  paths:
    - pattern: "core/src/persistence/**"
      tier: 2
    - pattern: "core/src/execution/**"
      tier: 2
    - pattern: "core/src/observability/**"
      tier: 2
    - pattern: "core/src/policy/**"
      tier: 2

policy:
  protected_paths:
    - AGENTS.md
    - awsf.config.yaml
    - core/src/state/task-machine.ts
    - core/src/execution/transport-broker.ts

observability:
  redaction_level_default: public

pricing: []
